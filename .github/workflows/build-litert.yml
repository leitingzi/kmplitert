name: Build LiteRT Native Libraries

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux-x64:
    runs-on: ubuntu-latest
    name: LiteRT (linux-x64)
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Checkout LiteRT
        uses: actions/checkout@v4
        with:
          repository: google-ai-edge/LiteRT
          path: LiteRT-repo
          lfs: true
          sparse-checkout: |
            litert/c
            litert/prebuilt
          sparse-checkout-cone-mode: false

      - name: Prepare Artifacts
        run: |
          DEST_PATH="library/kmplitert-core/generated/litert/linux/x64"
          rm -rf "$DEST_PATH"
          mkdir -p "$DEST_PATH/lib"
          mkdir -p "$DEST_PATH/include"
          
          echo "Copying libraries from linux_x86_64..."
          cp -vL LiteRT-repo/litert/prebuilt/linux_x86_64/* "$DEST_PATH/lib/"
          
          # Verify that we have real files, not LFS pointers
          for f in "$DEST_PATH/lib"/*; do
            if [[ "$f" != *.h && -f "$f" ]]; then
              size=$(stat -c%s "$f")
              if [ "$size" -lt 1000 ]; then
                echo "❌ Error: $f looks like a Git LFS pointer (size: $size bytes)"
                cat "$f"
                exit 1
              fi
            fi
          done
          
          echo "Copying headers..."
          cp -v LiteRT-repo/litert/c/*.h "$DEST_PATH/include/"
          
          rm -rf LiteRT-repo

      - name: Commit and push
        uses: ./.github/actions/commit-and-push
        with:
          message: "Update LiteRT prebuilt: linux x64"
          add: library/kmplitert-core/generated/litert/linux/x64

  build-linux-arm64:
    runs-on: ubuntu-latest
    name: LiteRT (linux-arm64)
    needs: build-linux-x64
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Checkout LiteRT
        uses: actions/checkout@v4
        with:
          repository: google-ai-edge/LiteRT
          path: LiteRT-repo
          lfs: true
          sparse-checkout: |
            litert/c
            litert/prebuilt
          sparse-checkout-cone-mode: false

      - name: Prepare Artifacts
        run: |
          DEST_PATH="library/kmplitert-core/generated/litert/linux/arm64"
          rm -rf "$DEST_PATH"
          mkdir -p "$DEST_PATH/lib"
          mkdir -p "$DEST_PATH/include"
          
          echo "Copying libraries from linux_arm64..."
          cp -vL LiteRT-repo/litert/prebuilt/linux_arm64/* "$DEST_PATH/lib/"
          
          for f in "$DEST_PATH/lib"/*; do
            if [[ "$f" != *.h && -f "$f" ]]; then
              size=$(stat -c%s "$f")
              if [ "$size" -lt 1000 ]; then
                echo "❌ Error: $f looks like a Git LFS pointer (size: $size bytes)"
                cat "$f"
                exit 1
              fi
            fi
          done
          
          echo "Copying headers..."
          cp -v LiteRT-repo/litert/c/*.h "$DEST_PATH/include/"
          
          rm -rf LiteRT-repo

      - name: Commit and push
        uses: ./.github/actions/commit-and-push
        with:
          message: "Update LiteRT prebuilt: linux arm64"
          add: library/kmplitert-core/generated/litert/linux/arm64

  build-mac-arm64:
    runs-on: macos-latest
    name: LiteRT (mac-arm64)
    needs: build-linux-arm64
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Checkout LiteRT
        uses: actions/checkout@v4
        with:
          repository: google-ai-edge/LiteRT
          path: LiteRT-repo
          lfs: true
          sparse-checkout: |
            litert/c
            litert/prebuilt
          sparse-checkout-cone-mode: false

      - name: Prepare Artifacts
        run: |
          DEST_PATH="library/kmplitert-core/generated/litert/mac/arm64"
          rm -rf "$DEST_PATH"
          mkdir -p "$DEST_PATH/lib"
          mkdir -p "$DEST_PATH/include"
          
          echo "Copying libraries from macos_arm64..."
          cp -vL LiteRT-repo/litert/prebuilt/macos_arm64/* "$DEST_PATH/lib/"
          
          for f in "$DEST_PATH/lib"/*; do
            if [[ "$f" != *.h && -f "$f" ]]; then
              size=$(stat -c%s "$f")
              if [ "$size" -lt 1000 ]; then
                echo "❌ Error: $f looks like a Git LFS pointer (size: $size bytes)"
                cat "$f"
                exit 1
              fi
            fi
          done
          
          echo "Copying headers..."
          cp -v LiteRT-repo/litert/c/*.h "$DEST_PATH/include/"
          
          rm -rf LiteRT-repo

      - name: Commit and push
        uses: ./.github/actions/commit-and-push
        with:
          message: "Update LiteRT prebuilt: mac arm64"
          add: library/kmplitert-core/generated/litert/mac/arm64

  build-win-x64:
    runs-on: windows-latest
    name: LiteRT (win-x64)
    needs: build-mac-arm64
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Checkout LiteRT
        uses: actions/checkout@v4
        with:
          repository: google-ai-edge/LiteRT
          path: LiteRT-repo
          lfs: true
          sparse-checkout: |
            litert/c
            litert/prebuilt
          sparse-checkout-cone-mode: false

      - name: Prepare Artifacts
        run: |
          $DEST_PATH="library/kmplitert-core/generated/litert/win/x64"
          Remove-Item -Recurse -Force $DEST_PATH
          New-Item -ItemType Directory -Force "$DEST_PATH/lib"
          New-Item -ItemType Directory -Force "$DEST_PATH/include"
          
          echo "Copying libraries from windows_x86_64..."
          Copy-Item -Path "LiteRT-repo/litert/prebuilt/windows_x86_64/*" -Destination "$DEST_PATH/lib/" -Force
          
          foreach ($f in Get-ChildItem "$DEST_PATH/lib") {
            if ($f.Name -notlike "*.h") {
              $size = (Get-Item $f.FullName).Length
              if ($size -lt 1000) {
                echo "❌ Error: $($f.FullName) looks like a Git LFS pointer (size: $size bytes)"
                Get-Content $f.FullName
                exit 1
              }
            }
          }
          
          echo "Copying headers..."
          Copy-Item -Path "LiteRT-repo/litert/c/*.h" -Destination "$DEST_PATH/include/" -Force
          
          Remove-Item -Recurse -Force LiteRT-repo

      - name: Commit and push
        uses: ./.github/actions/commit-and-push
        with:
          message: "Update LiteRT prebuilt: win x64"
          add: library/kmplitert-core/generated/litert/win/x64