name: Core Accelerator CI

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'core/**'
      - '.github/workflows/**'
      - 'build-logic/**'
      - 'gradle/**'
      - 'settings.gradle.kts'
      - '*.gradle.kts'
      - 'gradle.properties'

permissions:
  contents: read

jobs:
  # GitHub-hosted Linux runners do not provide GPU/NPU hardware; accelerator tests require hardware runners.
  linux-x64:
    name: Linux x64 CPU (JVM & Native)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21
          cache: gradle

      - name: Cache Kotlin/Native toolchains
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: ${{ runner.os }}-${{ runner.arch }}-konan-${{ hashFiles('gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-konan-

      - name: Build and Test (Linux x64 CPU)
        run: |
          chmod +x gradlew
          ./gradlew :core:assemble \
                    :core:compileKotlinLinuxArm64 \
                    :core:jvmTest \
                    :core:linuxX64Test \
                    --stacktrace

  # Kotlin/Native does not support Linux ARM64 as a build host.
  linux-arm64:
    name: Linux ARM64 JVM (LiteRT native library)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21
          cache: gradle

      - name: Build and Test (Linux ARM64 JVM)
        run: |
          chmod +x gradlew
          ./gradlew :core:jvmTest --stacktrace

  macos-gpu:
    name: macOS GPU & iOS Simulator CPU
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21
          cache: gradle

      - name: Cache Kotlin/Native toolchains
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: ${{ runner.os }}-${{ runner.arch }}-konan-${{ hashFiles('gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-konan-

      - name: JVM Tests (CPU)
        env:
          KMPLITERT_TEST_GPU: "false"
        run: |
          chmod +x gradlew
          ./gradlew :core:jvmTest --no-daemon --stacktrace

      - name: Build and Test (macOS GPU & iOS Simulator CPU)
        env:
          KMPLITERT_TEST_GPU: "true"
          SIMCTL_CHILD_KMPLITERT_TEST_GPU: "false"
        run: |
          chmod +x gradlew
          ./gradlew :core:assemble \
                    :core:macosArm64Test \
                    :core:iosSimulatorArm64Test \
                    --no-daemon \
                    --stacktrace

  windows:
    name: Windows CPU (JVM & Native)
    runs-on: windows-latest
    env:
      KMPLITERT_TEST_GPU: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21
          cache: gradle

      - name: Cache Kotlin/Native toolchains
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: ${{ runner.os }}-${{ runner.arch }}-konan-${{ hashFiles('gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-konan-

      - name: Build and Test (Windows CPU)
        shell: bash
        run: |
          ./gradlew :core:assemble \
                    :core:jvmTest \
                    :core:mingwX64Test \
                    --stacktrace

  android-emulator:
    name: Android Emulator CPU
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Cache Kotlin/Native toolchains
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: ${{ runner.os }}-${{ runner.arch }}-konan-${{ hashFiles('gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-konan-

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build and Test (Android Emulator CPU)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-linux-hw-accel: false
          disable-animations: true
          script: |
            chmod +x gradlew
            ./gradlew :core:connectedAndroidDeviceTest --stacktrace

  web-accelerators:
    name: JS & Wasm GPU/WebNN
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21
          cache: gradle

      - name: Setup Firefox
        uses: browser-actions/setup-firefox@v1
        with:
          firefox-version: latest

      - name: Build and Test (JS & Wasm)
        run: |
          chmod +x gradlew
          ./gradlew :core:jsBrowserTest \
                    :core:wasmJsBrowserTest \
                    --stacktrace
