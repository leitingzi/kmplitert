name: Core CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - master
    paths:
      - 'library/kmplitert-core/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'

jobs:
  linux-android-web:
    name: Linux, Android & Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21
          cache: gradle

      - name: Build and Test (Linux, Android, JS, Wasm)
        run: |
          chmod +x gradlew
          ./gradlew :library:kmplitert-core:assemble \
                    :library:kmplitert-core:linuxX64Test \
                    :library:kmplitert-core:testAndroidHostTest \
                    :library:kmplitert-core:jsBrowserTest \
                    :library:kmplitert-core:wasmJsBrowserTest \
                    --stacktrace --info --no-daemon

  macos-ios:
    name: MacOS & iOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21
          cache: gradle

      - name: Build and Test (MacOS, iOS)
        run: |
          chmod +x gradlew
          ./gradlew :library:kmplitert-core:assemble \
                    :library:kmplitert-core:macosArm64Test \
                    :library:kmplitert-core:iosSimulatorArm64Test \
                    --stacktrace --info --no-daemon

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21
          cache: gradle

      - name: Build and Test (Windows)
        run: |
          ./gradlew :library:kmplitert-core:assemble \
                    :library:kmplitert-core:mingwX64Test \
                    --stacktrace --info --no-daemon
