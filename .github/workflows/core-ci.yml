name: Core CI (Tests)

on:
  workflow_dispatch:
  pull_request:
    branches:
      - master
    paths:
      - 'library/kmplitert-core/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'

jobs:
  test-jvm:
    name: Test JVM • ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21
          cache: gradle

      - name: Run JVM Tests
        shell: bash
        run: |
          if [ "${{ runner.os }}" != "Windows" ]; then chmod +x gradlew; fi
          ./gradlew :library:kmplitert-core:jvmTest --no-configuration-cache --stacktrace --info --no-daemon

  test-android:
    name: Test Android
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21
          cache: gradle

      - run: chmod +x gradlew

      - name: Run Android Host Tests
        run: ./gradlew :library:kmplitert-core:testAndroidHostTest --no-configuration-cache --stacktrace --info --no-daemon

  test-native:
    name: Test Native • ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linuxX64
            os: ubuntu-latest
          - target: macosArm64
            os: macos-latest
          - target: mingwX64
            os: windows-latest
          - target: iosSimulatorArm64
            os: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21
          cache: gradle

      - name: Run Native Tests
        shell: bash
        run: |
          if [ "${{ runner.os }}" != "Windows" ]; then chmod +x gradlew; fi
          ./gradlew :library:kmplitert-core:${{ matrix.target }}Test --no-configuration-cache --stacktrace --info --no-daemon

  test-js:
    name: Test JavaScript
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21
          cache: gradle

      - run: chmod +x gradlew

      - name: Run JavaScript Tests
        run: ./gradlew :library:kmplitert-core:jsBrowserTest --no-configuration-cache --stacktrace --info --no-daemon

  test-wasm:
    name: Test Wasm
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21
          cache: gradle

      - run: chmod +x gradlew

      - name: Run Wasm Tests
        run: ./gradlew :library:kmplitert-core:wasmJsBrowserTest --no-configuration-cache --stacktrace --info --no-daemon
