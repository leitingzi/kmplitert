name: Deploy documentation

on:
  push:
    branches:
      - master
    paths:
      - "docs/**"
      - "app/**"
      - "core/**"
      - "build-logic/**"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "mkdocs.yml"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - "gradle.properties"
      - "requirements-docs.txt"
      - ".github/scripts/check_docs_i18n.py"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21
          cache: gradle

      - name: Build web demo
        run: |
          chmod +x gradlew
          ./gradlew :app:webApp:jsBrowserDistribution

      - name: Install documentation dependencies
        run: python -m pip install -r requirements-docs.txt

      - name: Build documentation
        run: mkdocs build --strict

      - name: Add web demo to documentation
        run: |
          mkdir -p site/demo-app
          cp -R app/webApp/build/dist/js/productionExecutable/. site/demo-app/

      - name: Verify translations and language links
        run: python .github/scripts/check_docs_i18n.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
