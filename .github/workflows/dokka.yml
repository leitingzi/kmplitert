name: Generate Dokka

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dokka:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21
          cache: gradle

      - run: chmod +x gradlew

      - name: Generate Dokka
        run: ./gradlew :library:kmplitert-core:dokkaGenerateHtml --no-configuration-cache

      - name: Copy Dokka to docs
        run: |
          rm -rf docs
          mkdir -p docs
          cp -a library/kmplitert-core/build/dokka/html/. docs/

      - name: Commit documentation
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: update Dokka documentation [skip ci]"
          branch: ${{ github.ref_name }}