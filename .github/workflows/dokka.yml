name: Generate Dokka

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dokka:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21
          cache: gradle

      - run: chmod +x gradlew

      - name: Generate Dokka
        run: ./gradlew :dokkaGenerateHtml --no-configuration-cache --no-daemon

      - name: Copy Dokka to docs
        run: |
          rm -rf docs
          mkdir -p docs
          cp -a build/dokka/html/. docs/

      - name: Commit documentation
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: update Dokka documentation [skip ci]"
          branch: ${{ github.ref_name }}
          # 允许在推送前尝试 rebase，减少冲突
          push_options: '--force' 
