name: Generate Dokka

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dokka:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21
          cache: gradle

      - run: chmod +x gradlew

      - name: Generate Dokka
        run: ./gradlew :dokkaGenerateHtml --no-configuration-cache --no-daemon

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/dokka/html
          publish_branch: gh-pages
          commit_message: "docs: update Dokka documentation [skip ci]"