name: iOS CI

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'app/shared/**'
      - 'app/iosApp/**'
      - 'core/**'
      - 'tool/**'
      - 'build-logic/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
  pull_request:
    branches:
      - master
    paths:
      - 'app/shared/**'
      - 'app/iosApp/**'
      - 'core/**'
      - 'tool/**'
      - 'build-logic/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'

jobs:
  ios-ci:
    name: Build and Test iOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21
          cache: gradle

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Run Native Tests (Core & Tool)
        run: |
          chmod +x gradlew
          ./gradlew :core:iosSimulatorArm64Test :tool:iosSimulatorArm64Test --no-daemon

      - name: Build iOS Framework
        run: |
          chmod +x gradlew
          # Verify source dylibs exist before building
          ls -R core/src/nativeInterop/lib/litert/ios/sim-arm64
          
          # Run the link task and bundling task together to ensure correct output directory resolution
          ./gradlew :app:shared:linkDebugFrameworkIosSimulatorArm64 :app:shared:bundleLiteRtToIosSimulatorArm64Debug --no-daemon

      - name: Verify libLiteRt.dylib existence in Framework
        run: |
          FRAMEWORK_PATH="app/shared/build/bin/iosSimulatorArm64/debugFramework/AppCore.framework"
          DYLIB_PATH="$FRAMEWORK_PATH/Frameworks/libLiteRt.dylib"
          
          if [ -f "$DYLIB_PATH" ]; then
            echo "✅ libLiteRt.dylib found in $DYLIB_PATH"
          else
            echo "❌ libLiteRt.dylib NOT found in $DYLIB_PATH"
            echo "Directory structure of $FRAMEWORK_PATH:"
            ls -R "$FRAMEWORK_PATH"
            exit 1
          fi

      - name: Build iOS App
        run: |
          xcodebuild -project app/iosApp/iosApp.xcodeproj \
                     -scheme iosApp \
                     -configuration Debug \
                     -sdk iphonesimulator \
                     -derivedDataPath build \
                     -destination 'platform=iOS Simulator,name=iPhone 17' \
                     build \
                     CODE_SIGNING_ALLOWED=NO
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}

      - name: Run iOS App (Smoke Test)
        run: |
          # 1. Boot the simulator
          DEVICE_ID=$(xcrun simctl list devices | grep "iPhone 17" | grep -v "unavailable" | head -1 | awk -F '[()]' '{print $2}')
          echo "Booting simulator with ID: $DEVICE_ID"
          xcrun simctl boot "$DEVICE_ID" || true
          
          # Wait for simulator to be ready
          xcrun simctl waitstatus "$DEVICE_ID" booted
          
          # 2. Install the app
          APP_PATH="build/Build/Products/Debug-iphonesimulator/iosApp.app"
          echo "Installing app from: $APP_PATH"
          xcrun simctl install "$DEVICE_ID" "$APP_PATH"
          
          # 3. Launch the app
          BUNDLE_ID="com.leitz.kmplitert.kmplitert"
          echo "Launching app: $BUNDLE_ID"
          xcrun simctl launch --console "$DEVICE_ID" "$BUNDLE_ID" &
          
          # 4. Wait and verify
          sleep 15
          
          # Check if the app process is still running
          if xcrun simctl spawn "$DEVICE_ID" ps aux | grep -v grep | grep "$BUNDLE_ID"; then
            echo "✅ App launched successfully and is still running."
          else
            echo "❌ App failed to stay running. It might have crashed."
            # Optional: collect crash logs if needed
            exit 1
          fi
          
          # 5. Cleanup
          xcrun simctl terminate "$DEVICE_ID" "$BUNDLE_ID"
          xcrun simctl shutdown "$DEVICE_ID"
