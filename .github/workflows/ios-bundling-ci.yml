name: iOS CI

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'app/shared/**'
      - 'app/iosApp/**'
      - 'core/**'
      - 'tool/**'
      - 'build-logic/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
  pull_request:
    branches:
      - master
    paths:
      - 'app/shared/**'
      - 'app/iosApp/**'
      - 'core/**'
      - 'tool/**'
      - 'build-logic/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'

jobs:
  ios-ci:
    name: Build and Test iOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21
          cache: gradle

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Run Native Tests (Core & Tool)
        run: |
          chmod +x gradlew
          ./gradlew :core:iosSimulatorArm64Test :tool:iosSimulatorArm64Test --no-daemon

      - name: Build iOS Framework
        run: |
          chmod +x gradlew
          # Verify source dylibs exist before building
          ls -R core/src/nativeInterop/lib/litert/ios/sim-arm64
          
          # Run the link task and bundling task together to ensure correct output directory resolution
          ./gradlew :app:shared:linkDebugFrameworkIosSimulatorArm64 :app:shared:bundleLiteRtToIosSimulatorArm64Debug --no-daemon

      - name: Verify libLiteRt.dylib existence in Framework
        run: |
          FRAMEWORK_PATH="app/shared/build/bin/iosSimulatorArm64/debugFramework/AppCore.framework"
          DYLIB_PATH="$FRAMEWORK_PATH/Frameworks/libLiteRt.dylib"
          
          if [ -f "$DYLIB_PATH" ]; then
            echo "✅ libLiteRt.dylib found in $DYLIB_PATH"
          else
            echo "❌ libLiteRt.dylib NOT found in $DYLIB_PATH"
            echo "Directory structure of $FRAMEWORK_PATH:"
            ls -R "$FRAMEWORK_PATH"
            exit 1
          fi

      - name: Build iOS App
        run: |
          xcodebuild -project app/iosApp/iosApp.xcodeproj \
                     -scheme iosApp \
                     -configuration Debug \
                     -sdk iphonesimulator \
                     -derivedDataPath build \
                     -destination 'platform=iOS Simulator,name=iPhone 17' \
                     build \
                     CODE_SIGNING_ALLOWED=NO
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}

      - name: Run iOS App (Smoke Test)
        run: |
          # 1. Debug: List all available devices
          echo "Listing all available simulators..."
          xcrun simctl list devices
          
          # 2. Extract Device ID for iPhone 17
          # The format is usually "Name (UDID) (Status)"
          DEVICE_ID=$(xcrun simctl list devices | grep "iPhone 17" | grep -v "unavailable" | head -1 | sed -E 's/.*\(([0-9A-F-]+)\).*/\1/')
          
          if [ -z "$DEVICE_ID" ]; then
            echo "❌ Could not find a valid iPhone 17 simulator ID."
            exit 1
          fi
          
          echo "✅ Using simulator with ID: $DEVICE_ID"
          
          # 3. Boot the simulator
          xcrun simctl boot "$DEVICE_ID" || true
          
          # Wait for simulator to be fully booted
          echo "Waiting for simulator to boot..."
          xcrun simctl bootstatus "$DEVICE_ID" -w
          
          # 4. Install the app
          APP_PATH="build/Build/Products/Debug-iphonesimulator/iosApp.app"
          echo "Installing app from: $APP_PATH"
          xcrun simctl install "$DEVICE_ID" "$APP_PATH"
          
          # 5. Launch the app
          BUNDLE_ID="com.leitz.kmplitert.kmplitert"
          echo "Launching app: $BUNDLE_ID"
          xcrun simctl launch "$DEVICE_ID" "$BUNDLE_ID"
          
          # 6. Wait and verify stability
          echo "Waiting 15 seconds to verify app stability..."
          sleep 15
          
          # Check if the app process is still running
          if xcrun simctl spawn "$DEVICE_ID" ps aux | grep "$BUNDLE_ID" | grep -v grep; then
            echo "✅ App is still running after 15 seconds."
          else
            echo "❌ App process not found. It might have crashed on startup."
            # Optionally list system logs if needed
            # xcrun simctl spawn "$DEVICE_ID" log show --last 1m --predicate 'process == "iosApp"'
            exit 1
          fi
          
          # 7. Cleanup
          xcrun simctl terminate "$DEVICE_ID" "$BUNDLE_ID"
          xcrun simctl shutdown "$DEVICE_ID"
