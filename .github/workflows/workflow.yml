name: Publish

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

  release:
    types:
      - released
      - prereleased

jobs:
  test-jvm:
    name: Test JVM • ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21
          cache: gradle

      - name: Run JVM Tests
        shell: bash
        run: |
          if [ "${{ runner.os }}" != "Windows" ]; then chmod +x gradlew; fi
          ./gradlew jvmTest --no-configuration-cache --stacktrace --info --no-daemon

  test-android:
    name: Test Android
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21
          cache: gradle

      - run: chmod +x gradlew

      - name: Run Android Unit Tests
        run: ./gradlew testDebugUnitTest --no-configuration-cache --stacktrace --info --no-daemon

  test-native:
    name: Test Native • ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linuxX64
            os: ubuntu-latest
          - target: macosArm64
            os: macos-latest
          - target: mingwX64
            os: windows-latest
          - target: iosSimulatorArm64
            os: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21
          cache: gradle

      - name: Run Native Tests
        shell: bash
        run: |
          if [ "${{ runner.os }}" != "Windows" ]; then chmod +x gradlew; fi
          ./gradlew ${{ matrix.target }}Test --no-configuration-cache --stacktrace --info --no-daemon

  test-js:
    name: Test JavaScript
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21
          cache: gradle

      - run: chmod +x gradlew

      - name: Run JavaScript Tests
        run: ./gradlew jsBrowserTest --no-configuration-cache --stacktrace --info --no-daemon

  test-wasm:
    name: Test Wasm
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21
          cache: gradle

      - run: chmod +x gradlew

      - name: Run Wasm Tests
        run: ./gradlew wasmJsBrowserTest --no-configuration-cache --stacktrace --info --no-daemon

  publish:
    name: Publish to Maven Central

    if: github.event_name == 'release'

    needs:
      - test-jvm
      - test-android
      - test-native
      - test-js
      - test-wasm

    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21
          cache: gradle

      - run: chmod +x gradlew

      - name: Publish
        run: ./gradlew publishToMavenCentral --no-configuration-cache --stacktrace --info --no-daemon
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_KEY_CONTENTS }}
