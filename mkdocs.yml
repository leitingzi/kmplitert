site_name: KMPLiteRT
site_description: Run LiteRT models with Kotlin Multiplatform
site_url: https://leitingzi.github.io/kmplitert/
repo_url: https://github.com/leitingzi/kmplitert
repo_name: leitingzi/kmplitert
docs_dir: docs

theme:
  name: material
  language: en
  logo: assets/orbit.svg
  favicon: assets/orbit.svg
  font: false
  palette:
    scheme: default
    primary: deep purple
    accent: deep purple
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight

extra_css:
  - stylesheets/docs.css

plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: false
      languages:
        - locale: en
          name: English
          default: true
          build: true
        - locale: zh
          name: 简体中文
          build: true
          site_description: 在 Kotlin Multiplatform 中运行 LiteRT 模型
          nav_translations:
            Home: 首页
            Start Here: 开始使用
            Getting Started: 快速开始
            Interactive Demo: 在线示例
            Modules: 模块
            Core Runtime: Core 推理
            Inference Lifecycle: 推理生命周期
            Tensors and Buffers: 张量与缓冲区
            Hardware Acceleration: 硬件加速
            Data Processing: 数据处理
            Platform Guides: 平台指南
            Platform Support: 平台支持
            Android: Android
            JVM: JVM
            iOS and macOS: iOS 与 macOS
            Linux and Windows Native: Linux 与 Windows Native
            JavaScript: JavaScript
            WasmJS: WasmJS
            Reference: 参考
            Core API: Core API
            Web Initialization: Web 初始化
            Troubleshooting: 问题排查
            Support and Contributing: 支持与贡献

validation:
  links:
    anchors: warn

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - tables

nav:
  - Home: index.md
  - Start Here:
      - Getting Started: getting-started.md
      - Interactive Demo: demo.md
  - Modules:
      - Core Runtime:
          - Inference Lifecycle: guide/lifecycle.md
          - Tensors and Buffers: guide/tensors.md
          - Hardware Acceleration: guide/acceleration.md
          - Core API: core-api.md
      - Data Processing: dataprocess.md
  - Platform Guides:
      - Platform Support: platforms.md
      - Android: platforms/android.md
      - JVM: platforms/jvm.md
      - iOS and macOS: platforms/apple.md
      - Linux and Windows Native: platforms/native-desktop.md
      - JavaScript: platforms/javascript.md
      - WasmJS: platforms/wasmjs.md
  - Reference:
      - Web Initialization: api/web.md
  - Troubleshooting: troubleshooting.md
  - Support and Contributing: support.md
