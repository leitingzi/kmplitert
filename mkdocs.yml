site_name: KMPLiteRT
site_description: Run LiteRT models with Kotlin Multiplatform
site_url: https://leitingzi.github.io/kmplitert/
repo_url: https://github.com/leitingzi/kmplitert
repo_name: leitingzi/kmplitert
docs_dir: docs

theme:
  name: material
  language: en
  logo: assets/orbit.svg
  favicon: assets/orbit.svg
  font: false
  palette:
    scheme: slate
    primary: black
    accent: grey
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight

extra_css:
  - stylesheets/space.css

plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: false
      languages:
        - locale: en
          name: English
          default: true
          build: true
        - locale: zh
          name: 简体中文
          build: true
          site_description: 在 Kotlin Multiplatform 中运行 LiteRT 模型
          nav_translations:
            Home: 首页
            Interactive Demo: 在线示例
            Getting Started: 开始使用
            Installation and First Inference: 安装与第一次推理
            Platforms and Capabilities: 平台与能力
            Core Guide: Core 指南
            Model and Inference Lifecycle: 模型与推理生命周期
            Tensors and Buffers: 张量与缓冲区
            Hardware Acceleration: 硬件加速
            Platform Guides: 平台指南
            iOS and macOS: iOS 与 macOS
            Linux and Windows Native: Linux 与 Windows Native
            API Reference: API 参考
            Web Initialization: Web 初始化
            Troubleshooting: 问题排查
            Support and Contributing: 支持与贡献

validation:
  links:
    anchors: warn

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - tables

nav:
  - Home: index.md
  - Interactive Demo: demo.md
  - Getting Started:
      - Installation and First Inference: getting-started.md
      - Platforms and Capabilities: platforms.md
  - Core Guide:
      - Model and Inference Lifecycle: guide/lifecycle.md
      - Tensors and Buffers: guide/tensors.md
      - Hardware Acceleration: guide/acceleration.md
  - Platform Guides:
      - Android: platforms/android.md
      - JVM: platforms/jvm.md
      - iOS and macOS: platforms/apple.md
      - Linux and Windows Native: platforms/native-desktop.md
      - JavaScript: platforms/javascript.md
      - WasmJS: platforms/wasmjs.md
  - API Reference:
      - Core API: core-api.md
      - Web Initialization: api/web.md
  - Troubleshooting: troubleshooting.md
  - Support and Contributing: support.md
