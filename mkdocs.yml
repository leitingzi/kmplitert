site_name: KMPLiteRT
site_description: 在 Kotlin Multiplatform 中运行 LiteRT 模型
site_url: https://leitingzi.github.io/kmplitert/
repo_url: https://github.com/leitingzi/kmplitert
repo_name: leitingzi/kmplitert
docs_dir: docs

theme:
  name: material
  language: zh
  logo: assets/orbit.svg
  favicon: assets/orbit.svg
  font: false
  palette:
    scheme: slate
    primary: black
    accent: grey
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight

extra_css:
  - stylesheets/space.css

plugins:
  - search

validation:
  links:
    anchors: warn

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - tables

nav:
  - 首页: index.md
  - 开始使用:
      - 安装与第一次推理: getting-started.md
      - 平台与能力: platforms.md
  - Core 指南:
      - 模型与推理生命周期: guide/lifecycle.md
      - 张量与缓冲区: guide/tensors.md
      - 硬件加速: guide/acceleration.md
  - 平台指南:
      - Android: platforms/android.md
      - JVM: platforms/jvm.md
      - iOS 与 macOS: platforms/apple.md
      - Linux 与 Windows Native: platforms/native-desktop.md
      - JavaScript: platforms/javascript.md
      - WasmJS: platforms/wasmjs.md
  - API 参考:
      - Core API: core-api.md
      - Web 初始化: api/web.md
  - 问题排查: troubleshooting.md
  - 支持与贡献: support.md
